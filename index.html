<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArXiv Physics News</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            /* Light Mode */
            --bg-color: #f4f7f6;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-secondary: #666666;
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --tag-bg: #e1ecf4;
            --tag-text: #2c3e50;
            --border-color: #ddd;
            --input-border: #ccd0d5;
            --shadow: rgba(0,0,0,0.05);
            --shadow-hover: rgba(0,0,0,0.1);
        }

        /* Dark Mode */
        [data-theme="dark"] {
            --bg-color: #121212;
            --header-bg: #1e1e1e;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #a0a0a0;
            --primary-color: #6ab0de;
            --accent-color: #ff6b6b;
            --tag-bg: #2c3e50;
            --tag-text: #ddeeff;
            --border-color: #333;
            --input-border: #444;
            --shadow: rgba(0,0,0,0.2);
            --shadow-hover: rgba(0,0,0,0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Header Layout */
        header {
            max-width: 800px;
            margin: 0 auto 20px auto;
            text-align: center;
            background: var(--header-bg);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px var(--shadow);
            transition: background-color 0.3s;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
            display: inline-block;
            margin-right: 10px;
        }
        
        .header-top {
            margin-bottom: 15px;
        }

        p.subtitle {
            display: inline-block;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 0;
        }

        .version-line {
            font-size: 0.65rem;
            color: var(--text-secondary);
            opacity: 0.6;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        /* Controls Toolbar */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        input[type="date"] {
            padding: 6px 10px;
            font-size: 0.9rem;
            background-color: var(--bg-color);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            color: var(--text-color);
            font-family: inherit;
            color-scheme: light dark;
        }

        /* Buttons */
        button {
            padding: 7px 15px;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            border: none;
            transition: opacity 0.2s;
            height: 34px;
        }
        button:hover { opacity: 0.9; }

        #update-btn {
            background-color: var(--primary-color);
            color: var(--bg-color);
        }

        #theme-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #theme-btn:hover { border-color: var(--primary-color); }

        /* News Cards */
        #news-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .article-card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px var(--shadow);
            padding: 18px;
            transition: transform 0.2s ease, background-color 0.3s;
            border-left: 4px solid var(--primary-color);
        }
        .article-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px var(--shadow-hover); }

        .category-tag {
            display: inline-block;
            background-color: var(--tag-bg);
            color: var(--tag-text);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .article-title { margin: 0 0 8px 0; font-size: 1.2rem; line-height: 1.3; }
        .article-title a { color: var(--primary-color); text-decoration: none; }
        .article-title a:hover { color: var(--accent-color); }

        .article-meta { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 10px; }

        .article-summary {
            font-size: 0.9rem;
            color: var(--text-color);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .read-more-btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .read-more-btn:hover { opacity: 0.9; }

        /* Status & Loading Spinner */
        .loading, .error {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 5px var(--shadow);
        }
        .error { color: var(--accent-color); }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Layout */
        @media (max-width: 600px) {
            .controls { gap: 10px; }
            .input-group { flex-basis: 45%; flex-grow: 1; flex-direction: column; align-items: flex-start; }
            .input-group input { width: 100%; box-sizing: border-box; }
            #update-btn, #theme-btn { flex-basis: 45%; flex-grow: 1; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <h1>Physics News</h1>
        <p class="subtitle">Pop-Ph & Ed-Ph</p>
        <div class="version-line">v2.15</div>
    </div>
    
    <div class="controls">
        <div class="input-group">
            <label for="start-date">Start</label>
            <input type="date" id="start-date">
        </div>
        <div class="input-group">
            <label for="end-date">End</label>
            <input type="date" id="end-date">
        </div>

        <button id="update-btn" onclick="fetchArxivNews()">Update</button>
        <button id="theme-btn" onclick="toggleTheme()">🌙</button>
    </div>
</header>

<div id="news-container">
    <div class="loading">
        <div class="spinner"></div>
        <p>Initializing...</p>
    </div>
</div>

<script>
    // --- Theme Management ---
    function toggleTheme() {
        const html = document.documentElement;
        const btn = document.getElementById('theme-btn');
        const currentTheme = html.getAttribute('data-theme');
        
        if (currentTheme === 'dark') {
            html.setAttribute('data-theme', 'light');
            btn.textContent = '🌙';
            localStorage.setItem('theme', 'light');
        } else {
            html.setAttribute('data-theme', 'dark');
            btn.textContent = '☀️';
            localStorage.setItem('theme', 'dark');
        }
    }

    (function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('theme-btn').textContent = '☀️';
        }
    })();

    // --- Helper Functions ---
    function formatDateInput(date) {
        const pad = (n) => n.toString().padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function getApiDateStart(dateString) { return dateString.replace(/-/g, '') + '0000'; }
    function getApiDateEnd(dateString) { return dateString.replace(/-/g, '') + '2359'; }

    function formatDateForDisplay(dateString) {
        if (!dateString) return 'Unknown Date';
        const date = new Date(dateString);
        return isNaN(date) ? dateString : date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function getXmlText(parent, tagName) {
        const el = parent.getElementsByTagName(tagName)[0];
        return el ? el.textContent : '';
    }

    async function fetchWithTimeout(resource, options = {}) {
        const { timeout = 10000 } = options;
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        try {
            const response = await fetch(resource, {
                ...options,
                signal: controller.signal
            });
            clearTimeout(id);
            return response;
        } catch (err) {
            clearTimeout(id);
            throw err;
        }
    }

    // Reliable public proxies (AllOrigins, CodeTabs, ThingProxy)
    const PROXIES = [
        { name: 'AllOrigins', buildUrl: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}` },
        { name: 'CodeTabs', buildUrl: (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}` },
        { name: 'ThingProxy', buildUrl: (url) => `https://thingproxy.freeboard.io/fetch/${url}` }
    ];

    // --- Main Fetch Function ---
    window.onload = function() {
        const today = new Date();
        const twoWeeksAgo = new Date();
        twoWeeksAgo.setDate(today.getDate() - 14);

        document.getElementById('end-date').value = formatDateInput(today);
        document.getElementById('start-date').value = formatDateInput(twoWeeksAgo);

        fetchArxivNews();
    };

    async function fetchArxivNews() {
        const container = document.getElementById('news-container');
        const startDateVal = document.getElementById('start-date').value;
        const endDateVal = document.getElementById('end-date').value;

        if (!startDateVal || !endDateVal) { 
            alert("Please select both start and end dates."); 
            return; 
        }

        const updateStatus = (msg) => {
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="margin:0; font-size:0.9rem;">${msg}</p>
                </div>`;
        };

        updateStatus("Preparing query...");

        const startQuery = getApiDateStart(startDateVal);
        const endQuery = getApiDateEnd(endDateVal);
        const query = `search_query=(cat:physics.pop-ph OR cat:physics.ed-ph) AND submittedDate:[${startQuery} TO ${endQuery}]&sortBy=submittedDate&sortOrder=descending&max_results=50`;
        
        // Enforce HTTPS to avoid Mixed Content errors on GitHub Pages
        const arxivUrl = `https://export.arxiv.org/api/query?${query}`;

        let xmlTextData = null;
        let lastErrorMessage = "";

        for (let i = 0; i < PROXIES.length; i++) {
            const proxy = PROXIES[i];
            const proxyUrl = proxy.buildUrl(arxivUrl);
            
            updateStatus(`Connecting via ${proxy.name} (Attempt ${i + 1}/${PROXIES.length})...`);

            try {
                const response = await fetchWithTimeout(proxyUrl, { timeout: 10000 });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                updateStatus(`Receiving data from ${proxy.name}...`);
                const text = await response.text();

                if (text && (text.includes('<feed') || text.includes('<entry') || text.includes('xmlns'))) {
                    xmlTextData = text;
                    break;
                } else {
                    throw new Error("Invalid response format");
                }
            } catch (err) {
                console.warn(`Proxy ${proxy.name} failed:`, err);
                lastErrorMessage = err.name === 'AbortError' ? 'Connection timed out (10s)' : err.message;
            }
        }

        if (!xmlTextData) {
            container.innerHTML = `
                <div class="error">
                    <strong>Unable to Connect to arXiv</strong><br>
                    <p style="font-size: 0.85rem; margin: 8px 0 15px 0;">All proxies timed out or failed.<br>Details: ${lastErrorMessage}</p>
                    <button onclick="fetchArxivNews()" id="update-btn" style="padding: 6px 14px; font-size:0.85rem;">Retry Connection</button>
                </div>`;
            return;
        }

        updateStatus("Parsing arXiv papers...");

        try {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlTextData, "text/xml");
            const entries = xmlDoc.getElementsByTagName("entry");

            container.innerHTML = '';

            if (entries.length === 0) {
                container.innerHTML = `
                    <div class="error">
                        No papers found between ${startDateVal} and ${endDateVal}.<br>
                        <small>Try widening the date range.</small>
                    </div>`;
                return;
            }

            Array.from(entries).forEach(entry => {
                let title = getXmlText(entry, "title").replace(/\n/g, ' ').trim();
                let summary = getXmlText(entry, "summary").replace(/\n/g, ' ').trim();
                let published = getXmlText(entry, "published");
                let absLink = getXmlText(entry, "id");
                
                if (!title || !absLink) return;

                const authors = Array.from(entry.getElementsByTagName("author")).map(a => a.textContent.trim()).join(", ");
                const pdfLink = absLink.replace("/abs/", "/pdf/");

                const primaryCat = entry.getElementsByTagName("arxiv:primary_category")[0]?.getAttribute("term");
                let catLabel = "Physics";
                if(primaryCat === "physics.pop-ph") catLabel = "Popular Physics";
                if(primaryCat === "physics.ed-ph") catLabel = "Physics Education";

                const card = document.createElement('div');
                card.className = 'article-card';
                card.innerHTML = `
                    <span class="category-tag">${catLabel}</span>
                    <h2 class="article-title"><a href="${absLink}" target="_blank">${title}</a></h2>
                    <div class="article-meta">
                        <strong>Published:</strong> ${formatDateForDisplay(published)} <br>
                        <strong>Authors:</strong> ${authors}
                    </div>
                    <p class="article-summary">${summary}</p>
                    <a href="${pdfLink}" target="_blank" class="read-more-btn">View PDF</a>
                `;
                container.appendChild(card);
            });

        } catch (error) {
            console.error('Parsing Error:', error);
            container.innerHTML = `
                <div class="error">
                    <strong>Failed to parse arXiv data.</strong><br>
                    <small>${error.message}</small>
                </div>`;
        }
    }

    // --- Service Worker Registration ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then((reg) => console.log('Service Worker registered!', reg))
                .catch((err) => console.log('Service Worker failed:', err));
        });
    }
</script>

</body>
</html>
